<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Main circular base platform -->
  <circle cx="100" cy="100" r="72" fill="#334155" stroke="#475569" stroke-width="2"/>
  <!-- Hexagonal top plate -->
  <polygon points="100,38 152,69 152,131 100,162 48,131 48,69" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
  <!-- Left wheel -->
  <rect x="18" y="72" width="22" height="56" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <!-- Right wheel -->
  <rect x="160" y="72" width="22" height="56" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <!-- Wheel axle lines left -->
  <line x1="18" y1="88" x2="40" y2="88" stroke="#64748b" stroke-width="1"/>
  <line x1="18" y1="100" x2="40" y2="100" stroke="#64748b" stroke-width="1"/>
  <line x1="18" y1="112" x2="40" y2="112" stroke="#64748b" stroke-width="1"/>
  <!-- Wheel axle lines right -->
  <line x1="160" y1="88" x2="182" y2="88" stroke="#64748b" stroke-width="1"/>
  <line x1="160" y1="100" x2="182" y2="100" stroke="#64748b" stroke-width="1"/>
  <line x1="160" y1="112" x2="182" y2="112" stroke="#64748b" stroke-width="1"/>
  <!-- Waffle grid pattern on top plate -->
  <line x1="70" y1="60" x2="70" y2="140" stroke="#3b4f6a" stroke-width="1"/>
  <line x1="85" y1="52" x2="85" y2="148" stroke="#3b4f6a" stroke-width="1"/>
  <line x1="100" y1="48" x2="100" y2="152" stroke="#3b4f6a" stroke-width="1"/>
  <line x1="115" y1="52" x2="115" y2="148" stroke="#3b4f6a" stroke-width="1"/>
  <line x1="130" y1="60" x2="130" y2="140" stroke="#3b4f6a" stroke-width="1"/>
  <line x1="56" y1="75" x2="144" y2="75" stroke="#3b4f6a" stroke-width="1"/>
  <line x1="50" y1="90" x2="150" y2="90" stroke="#3b4f6a" stroke-width="1"/>
  <line x1="50" y1="100" x2="150" y2="100" stroke="#3b4f6a" stroke-width="1"/>
  <line x1="50" y1="110" x2="150" y2="110" stroke="#3b4f6a" stroke-width="1"/>
  <line x1="56" y1="125" x2="144" y2="125" stroke="#3b4f6a" stroke-width="1"/>
  <!-- Raspberry Pi board -->
  <rect x="72" y="80" width="56" height="38" rx="4" fill="#166534" stroke="#22c55e" stroke-width="1.5"/>
  <!-- Pi board USB/port details -->
  <rect x="74" y="84" width="10" height="6" rx="1" fill="#0f4a26"/>
  <rect x="87" y="84" width="10" height="6" rx="1" fill="#0f4a26"/>
  <rect x="74" y="94" width="10" height="6" rx="1" fill="#0f4a26"/>
  <rect x="87" y="94" width="10" height="6" rx="1" fill="#0f4a26"/>
  <!-- Pi CPU chip -->
  <rect x="104" y="84" width="20" height="20" rx="2" fill="#0f4a26" stroke="#22c55e" stroke-width="1"/>
  <rect x="107" y="87" width="14" height="14" rx="1" fill="#1a5c30"/>
  <!-- Pi LED indicators -->
  <circle cx="117" cy="110" r="2.5" fill="#22c55e" opacity="0.9"/>
  <circle cx="124" cy="110" r="2.5" fill="#3b82f6" opacity="0.9"/>
  <!-- LiDAR sensor on top -->
  <circle cx="100" cy="66" r="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="100" cy="66" r="7" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="100" cy="66" r="3" fill="#3b82f6"/>
  <!-- LiDAR scan lines -->
  <line x1="100" y1="54" x2="100" y2="50" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
  <line x1="110" y1="57" x2="113" y2="54" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
  <line x1="90" y1="57" x2="87" y2="54" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
  <line x1="112" y1="66" x2="116" y2="66" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
  <line x1="88" y1="66" x2="84" y2="66" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
  <!-- Camera at front -->
  <rect x="88" y="148" width="24" height="12" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="100" cy="154" r="4" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="100" cy="154" r="2" fill="#1d4ed8"/>
  <!-- Front direction indicator -->
  <polygon points="100,160 94,170 106,170" fill="#22c55e" opacity="0.7"/>
  <!-- Caster wheel front -->
  <circle cx="100" cy="168" r="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
</svg>
